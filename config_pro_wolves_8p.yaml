# 能力不对称实验（平衡局）：8 人局 = 3 狼 + 预言家/女巫/猎人 + 2 平民
# 狼用 deepseek-v4-pro，好人用 deepseek-v4-flash；屠边规则，神职 3 个
game:
  max_rounds: 5
  speech_max_chars: 200
  werewolf_discuss_rounds: 1

llm:
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  default_model: deepseek-v4-flash
  temperature: 0.8
  max_tokens: 1500
  timeout_seconds: 60
  max_retries: 2

players:
  - name: Alice
    role: werewolf
    model: deepseek-v4-pro      # ← 强模型当狼
  - name: Bob
    role: werewolf
    model: deepseek-v4-pro      # ← 强模型当狼
  - name: Gina
    role: werewolf
    model: deepseek-v4-pro      # ← 强模型当狼
  - name: Carol
    role: seer
    model: deepseek-v4-flash
  - name: David
    role: witch
    model: deepseek-v4-flash
  - name: Henry
    role: hunter
    model: deepseek-v4-flash
  - name: Eve
    role: villager
    model: deepseek-v4-flash
  - name: Frank
    role: villager
    model: deepseek-v4-flash
