# 能力不对称实验：狼人用强模型 deepseek-v4-pro，好人仍用 deepseek-v4-flash
game:
  max_rounds: 5
  speech_max_chars: 200
  werewolf_discuss_rounds: 2

llm:
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  default_model: deepseek-v4-flash  # 复盘解说员等默认调用
  temperature: 0.8
  max_tokens: 1500
  timeout_seconds: 60
  max_retries: 2

players:
  - name: Alice
    role: werewolf
    model: deepseek-v4-pro      # ← 强模型当狼
  - name: Bob
    role: werewolf
    model: deepseek-v4-pro      # ← 强模型当狼
  - name: Carol
    role: seer
    model: deepseek-v4-flash
  - name: David
    role: witch
    model: deepseek-v4-flash
  - name: Eve
    role: villager
    model: deepseek-v4-flash
  - name: Frank
    role: villager
    model: deepseek-v4-flash
