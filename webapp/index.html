<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐺 多Agent狼人杀 · 人机对局</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #14151f; color: #e6e6e6; height: 100vh;
         display: flex; flex-direction: column; }
  header { padding: 10px 18px; background: #1d1f2e; display: flex;
           align-items: center; gap: 12px; border-bottom: 1px solid #333; }
  header h1 { font-size: 17px; color: #bb9af7; }
  #status { font-size: 13px; color: #888; }
  main { flex: 1; display: flex; min-height: 0; }
  #feed { flex: 1; overflow-y: auto; padding: 14px 18px; }
  #sidebar { width: 210px; background: #1d1f2e; border-left: 1px solid #333;
             padding: 14px; }
  .msg { margin: 5px 0; padding: 7px 11px; border-radius: 6px;
         background: #24283b; font-size: 14px; line-height: 1.55;
         white-space: pre-wrap; word-break: break-all; }
  .msg.private { background: #3d2f16; border-left: 3px solid #e0af68; }
  .msg.private::before { content: "🔒 "; }
  .msg.wolf { background: #3b1f2a; border-left: 3px solid #f7768e; }
  .msg.system { background: transparent; color: #7aa2f7; font-weight: bold;
                text-align: center; padding: 10px 0 2px; }
  #role-card { background: #2d2640; border: 1px solid #bb9af7;
               border-radius: 8px; padding: 12px; margin-bottom: 12px;
               font-size: 14px; line-height: 1.7; display: none; }
  #roster div { font-size: 13px; padding: 3px 0; color: #aaa; }
  #thinking-line { display: none; align-items: center; gap: 8px;
                  padding: 6px 18px; background: #1d1f2e; font-size: 13px;
                  color: #7aa2f7; border-top: 1px solid #333; }
  .spinner { width: 12px; height: 12px; border: 2px solid #364a82;
             border-top-color: #7aa2f7; border-radius: 50%;
             animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; }
                    50% { content: ".."; } 75% { content: "..."; } }
  #inputbar { padding: 10px 14px; background: #1d1f2e;
              border-top: 1px solid #333; }
  #ask-prompt { font-size: 14px; color: #e0af68; margin-bottom: 8px;
                display: none; }
  #choices { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #choices button { background: #364a82; color: #fff; border: none;
                    padding: 7px 16px; border-radius: 6px; cursor: pointer;
                    font-size: 14px; }
  #choices button:hover { background: #4a63a8; }
  #choices button.abstain { background: #555; }
  #textrow { display: flex; gap: 8px; }
  #textin { flex: 1; background: #24283b; border: 1px solid #444; color: #eee;
            padding: 9px 12px; border-radius: 6px; font-size: 14px; outline: none; }
  #textin:disabled { opacity: 0.4; }
  #sendbtn { background: #9ece6a; color: #14151f; border: none; padding: 0 20px;
             border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
  #sendbtn:disabled { opacity: 0.4; cursor: default; }
  #lobby { position: fixed; inset: 0; background: rgba(10,10,18,0.92);
           display: flex; align-items: center; justify-content: center; z-index: 10; }
  #lobby .panel { background: #1d1f2e; border: 1px solid #444;
                  border-radius: 12px; padding: 32px 40px; width: 380px; }
  #lobby h2 { color: #bb9af7; margin-bottom: 18px; text-align: center; }
  #lobby .group { margin-bottom: 16px; }
  #lobby .label { font-size: 13px; color: #999; margin-bottom: 6px; }
  #lobby .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  #lobby .opt { background: #24283b; border: 1px solid #444; color: #ddd;
                padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #lobby .opt.sel { background: #364a82; border-color: #7aa2f7; color: #fff; }
  #startbtn { width: 100%; background: #9ece6a; color: #14151f; border: none;
              padding: 11px; border-radius: 8px; font-size: 16px;
              font-weight: bold; cursor: pointer; margin-top: 6px; }
  .gameover { background: #2d2640 !important; border: 1px solid #bb9af7;
              font-size: 15px !important; }
  #endpanel { position: fixed; inset: 0; background: rgba(10,10,18,0.88);
              display: none; align-items: center; justify-content: center; z-index: 9; }
  #endpanel .panel { background: #1d1f2e; border: 1px solid #bb9af7;
                     border-radius: 12px; padding: 24px 28px; width: 640px;
                     max-width: 92vw; max-height: 86vh; overflow-y: auto; }
  #endpanel h2 { text-align: center; margin-bottom: 10px; }
  #end-reveal { background: #24283b; border-radius: 8px; padding: 10px 14px;
                font-size: 13px; color: #ccc; line-height: 1.7; margin-bottom: 14px; }
  #review-box { background: #14151f; border: 1px solid #444; border-radius: 8px;
                padding: 12px 16px; font-size: 14px; line-height: 1.7;
                max-height: 46vh; overflow-y: auto; margin-bottom: 14px; }
  #review-box h3 { color: #bb9af7; margin: 12px 0 4px; font-size: 15px; }
  #review-box h4 { color: #7aa2f7; margin: 10px 0 3px; font-size: 14px; }
  #review-box p { margin: 4px 0; }
  #review-box li { margin: 2px 0 2px 18px; }
  #review-box .loading { color: #e0af68; }
  #end-btns { display: flex; gap: 10px; }
  #end-btns button { flex: 1; border: none; padding: 10px; border-radius: 8px;
                     font-size: 15px; font-weight: bold; cursor: pointer; }
  #btn-back { background: #364a82; color: #fff; }
  #btn-again { background: #9ece6a; color: #14151f; }
  #btn-end { background: none; border: 1px solid #bb9af7; color: #bb9af7;
             border-radius: 6px; padding: 3px 10px; font-size: 13px;
             cursor: pointer; display: none; }
  #hist-list { max-height: 150px; overflow-y: auto; }
  .hist-item { background: #24283b; border: 1px solid #444; color: #ccc;
               border-radius: 6px; padding: 6px 10px; margin: 4px 0;
               font-size: 12px; cursor: pointer; text-align: left; width: 100%; }
  .hist-item:hover { border-color: #7aa2f7; color: #fff; }
  #discuss-box { border-top: 1px solid #444; padding-top: 10px; margin-bottom: 12px; }
  #discuss-log { max-height: 30vh; overflow-y: auto; margin-bottom: 8px; }
  .dmsg { background: #24283b; border-radius: 6px; padding: 6px 10px;
          margin: 5px 0; font-size: 13px; line-height: 1.6; }
  .dmsg b { color: #7aa2f7; }
  .dmsg.me { background: #2d3a24; }
  .dmsg.me b { color: #9ece6a; }
  #discuss-row { display: flex; gap: 8px; }
  #discuss-in { flex: 1; background: #24283b; border: 1px solid #444; color: #eee;
                padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
  #discuss-send { background: #7aa2f7; color: #14151f; border: none;
                  padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  #discuss-title { font-size: 13px; color: #e0af68; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>🐺 多Agent狼人杀 · 人机对局</h1>
  <span id="status">等待开局</span>
  <button id="btn-end">🏁 结算 / 复盘</button>
</header>
<main>
  <div id="feed"></div>
  <div id="sidebar">
    <div id="role-card"></div>
    <div id="roster"></div>
  </div>
</main>
<div id="thinking-line"><span class="spinner"></span><span id="thinking-text"></span><span class="dots"></span></div>
<div id="inputbar">
  <div id="ask-prompt"></div>
  <div id="choices"></div>
  <div id="textrow">
    <input id="textin" placeholder="等待提问…" disabled>
    <button id="sendbtn" disabled>发送</button>
  </div>
</div>

<div id="endpanel">
  <div class="panel">
    <h2 id="end-title">对局结束</h2>
    <div id="end-reveal"></div>
    <div id="review-box"><span class="loading">🎙️ 解说员复盘生成中…（可以先点下方按钮回看本局对话）</span></div>
    <div id="discuss-box">
      <div id="discuss-title">💬 赛后讨论 · 全员已亮身份，随便问（他们会交出自己掌握的信息和推理）</div>
      <div id="discuss-log"></div>
      <div id="discuss-row">
        <input id="discuss-in" placeholder="例如：Carol 你为什么第一晚验 David？">
        <button id="discuss-send">问全场</button>
      </div>
    </div>
    <div id="end-btns">
      <button id="btn-back">📜 回看本局对话</button>
      <button id="btn-again">🔄 再来一局</button>
    </div>
  </div>
</div>

<div id="lobby">
  <div class="panel">
    <h2>🐺 狼人杀 · 开局</h2>
    <div class="group">
      <div class="label">局型</div>
      <div class="opts" id="cfg-opts">
        <button class="opt sel" data-v="6p">6 人局</button>
        <button class="opt" data-v="8p">8 人局（含猎人）</button>
      </div>
    </div>
    <div class="group">
      <div class="label">你想扮演</div>
      <div class="opts" id="role-opts">
        <button class="opt sel" data-v="random">🎲 随机</button>
        <button class="opt" data-v="werewolf">🐺 狼人</button>
        <button class="opt" data-v="seer">🔮 预言家</button>
        <button class="opt" data-v="witch">🧪 女巫</button>
        <button class="opt" data-v="villager">👨‍🌾 平民</button>
      </div>
    </div>
    <button id="startbtn">开始对局</button>
    <div class="group" style="margin-top:16px">
      <div class="label">📜 历史对局（点击回看完整对话与复盘）</div>
      <div id="hist-list"><div style="font-size:12px;color:#666">加载中…</div></div>
    </div>
  </div>
</div>

<script>
const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
const askPrompt = document.getElementById("ask-prompt");
const choicesEl = document.getElementById("choices");
const textin = document.getElementById("textin");
const sendbtn = document.getElementById("sendbtn");
const roleCard = document.getElementById("role-card");
const roster = document.getElementById("roster");
const lobby = document.getElementById("lobby");

let ws, selCfg = "6p", selRole = "random", gameEnded = false, liveDiscuss = false;

function mdToHtml(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return md.split("\n").map(line => {
    let l = esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    if (l.startsWith("### ")) return `<h4>${l.slice(4)}</h4>`;
    if (l.startsWith("## ")) return `<h3>${l.slice(3)}</h3>`;
    if (l.startsWith("# ")) return `<h3>${l.slice(2)}</h3>`;
    if (/^[-*] /.test(l)) return `<li>${l.slice(2)}</li>`;
    if (/^\d+\. /.test(l)) return `<li>${l}</li>`;
    if (!l.trim()) return "";
    return `<p>${l}</p>`;
  }).join("");
}

function bindOpts(id, cb) {
  document.getElementById(id).addEventListener("click", e => {
    if (!e.target.classList.contains("opt")) return;
    document.querySelectorAll("#" + id + " .opt").forEach(b => b.classList.remove("sel"));
    e.target.classList.add("sel");
    cb(e.target.dataset.v);
  });
}
bindOpts("cfg-opts", v => selCfg = v);
bindOpts("role-opts", v => selRole = v);

function addMsg(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + (kind || "public");
  if (text.startsWith("-----") || text.startsWith("=====")) div.className = "msg system";
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function setWaiting(on) {
  textin.disabled = on;
  sendbtn.disabled = on;
  if (!on) { askPrompt.style.display = "none"; choicesEl.style.display = "none";
             textin.placeholder = "等待提问…"; }
}

function showAsk(m) {
  askPrompt.textContent = "❓ " + m.prompt;
  askPrompt.style.display = "block";
  if (m.kind === "choice") {
    choicesEl.innerHTML = "";
    m.candidates.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c;
      b.onclick = () => { answer(c); };
      choicesEl.appendChild(b);
    });
    if (m.allow_abstain) {
      const b = document.createElement("button");
      b.textContent = "弃权/不用";
      b.className = "abstain";
      b.onclick = () => { answer(""); };
      choicesEl.appendChild(b);
    }
    choicesEl.style.display = "flex";
  } else {
    textin.disabled = false;
    textin.placeholder = "输入你的发言…";
    sendbtn.disabled = false;
    textin.focus();
  }
}

function answer(text) {
  ws.send(JSON.stringify({t: "answer", text}));
  // 答完立刻收起提问区（比如女巫用完毒药，按钮不再挂着）
  askPrompt.style.display = "none";
  choicesEl.style.display = "none";
  choicesEl.innerHTML = "";
  setWaiting(true);
}

function showThinking(on, label) {
  const el = document.getElementById("thinking-line");
  if (on && label) {
    document.getElementById("thinking-text").textContent = label;
    el.style.display = "flex";
  } else {
    el.style.display = "none";
  }
}

sendbtn.onclick = () => { if (textin.value.trim()) { answer(textin.value.trim()); textin.value = ""; } };
textin.addEventListener("keydown", e => { if (e.key === "Enter") sendbtn.onclick(); });

function connect() {  // 页面加载即建立连接，历史对局不依赖开局
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = ev => handle(JSON.parse(ev.data));
  ws.onopen = () => ws.send(JSON.stringify({t: "history"}));
  ws.onclose = () => { statusEl.textContent = "连接已断开（刷新页面重开）"; };
}
connect();

function refreshHistory() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({t: "history"}));
}

document.getElementById("startbtn").onclick = () => {
  lobby.style.display = "none";
  document.getElementById("endpanel").style.display = "none";
  document.getElementById("btn-end").style.display = "none";
  gameEnded = false;
  feed.innerHTML = "";
  roleCard.style.display = "none";
  statusEl.textContent = "连接中…";
  if (!ws || ws.readyState !== WebSocket.OPEN) connect();
  const sendStart = () => ws.send(JSON.stringify({t: "start", config: selCfg, role: selRole}));
  if (ws.readyState === WebSocket.OPEN) sendStart();
  else ws.onopen = () => { sendStart(); refreshHistory(); };
};

function handle(m) {
  if (m.t === "feed") addMsg(m.text, m.kind);
  else if (m.t === "thinking") showThinking(m.on, m.label);
  else if (m.t === "ask") { statusEl.textContent = "等待你的决策…"; showAsk(m); }
  else if (m.t === "role") {
    roleCard.innerHTML = `🎭 你的身份：<b>${m.role_name}</b>` +
      (m.mates ? `<br>🐺 狼队友：${m.mates}` : "");
    roleCard.style.display = "block";
  }
  else if (m.t === "started") {
    statusEl.textContent = `对局进行中 · 你是 ${m.name}`;
    roster.innerHTML = "<b style='font-size:13px'>玩家</b>" +
      m.players.map(p => `<div>${p === m.name ? "🧑 " + p + "（你）" : "🤖 " + p}</div>`).join("");
  }
  else if (m.t === "game_over") {
    statusEl.textContent = "对局结束";
    showThinking(false);
    const who = m.winner === "village" ? "🎉 好人阵营获胜" : "🐺 狼人阵营获胜";
    addMsg(`${who}\n身份揭晓：${m.reveal}`, "public");
    feed.lastChild.classList.add("gameover");
    // 终局面板：胜负 + 身份揭晓 + 复盘 + 赛后讨论，不遮挡对话记录
    gameEnded = true;
    liveDiscuss = true;
    document.getElementById("end-title").textContent = who;
    document.getElementById("end-reveal").innerHTML =
      "<b>身份揭晓</b><br>" + m.reveal.split("；").map(s => escHtml(s)).join("<br>");
    document.getElementById("review-box").innerHTML =
      '<span class="loading">🎙️ 解说员复盘生成中…（可以先点下方按钮回看本局对话）</span>';
    document.getElementById("discuss-log").innerHTML = "";
    document.getElementById("discuss-box").style.display = "block";
    document.getElementById("endpanel").style.display = "flex";
    document.getElementById("btn-end").style.display = "inline-block";
    document.getElementById("startbtn").textContent = "再来一局";
  }
  else if (m.t === "review") {
    document.getElementById("review-box").innerHTML = mdToHtml(m.md);
    refreshHistory();  // 本局已存档，刷新大厅历史列表
  }
  else if (m.t === "discuss_msg") {
    addDiscuss(m.player + "（" + m.role_name + "）", m.text, false);
  }
  else if (m.t === "history_list") {
    const el = document.getElementById("hist-list");
    if (!m.games.length) { el.innerHTML = '<div style="font-size:12px;color:#666">还没有对局记录</div>'; return; }
    el.innerHTML = "";
    m.games.forEach(g => {
      const b = document.createElement("button");
      b.className = "hist-item";
      const who = g.winner === "village" ? "🎉好人胜" : "🐺狼人胜";
      b.textContent = `${g.ts} · ${g.cfg === "8p" ? "8人局" : "6人局"} · ${who} · 你是${g.players.find(p => p.name === (g.human || ""))?.role_name || "?"}`;
      b.onclick = () => ws.send(JSON.stringify({t: "load_history", id: g.id}));
      el.appendChild(b);
    });
  }
  else if (m.t === "history_game") {  // 回看历史对局：重放对话流 + 结算面板（无讨论）
    const g = m.game;
    lobby.style.display = "none";
    showThinking(false);
    feed.innerHTML = "";
    gameEnded = true;
    liveDiscuss = false;
    g.feed.forEach(e => {
      if (e.t === "feed") addMsg(e.text, e.kind);
      else if (e.t === "role") {
        roleCard.innerHTML = `🎭 本局你的身份：<b>${e.role_name}</b>` +
          (e.mates ? `<br>🐺 狼队友：${e.mates}` : "");
        roleCard.style.display = "block";
      }
    });
    const who = g.winner === "village" ? "🎉 好人阵营获胜" : "🐺 狼人阵营获胜";
    statusEl.textContent = `回看历史对局 · ${g.ts}`;
    document.getElementById("end-title").textContent = who + "（历史回放）";
    document.getElementById("end-reveal").innerHTML =
      "<b>身份揭晓</b><br>" + (g.reveal || "").split("；").map(s => escHtml(s)).join("<br>");
    document.getElementById("review-box").innerHTML = mdToHtml(g.review || "（本局无复盘）");
    document.getElementById("discuss-box").style.display = "none";
    document.getElementById("endpanel").style.display = "flex";
    document.getElementById("btn-end").style.display = "inline-block";
  }
}

function addDiscuss(who, text, isMe) {
  const div = document.createElement("div");
  div.className = "dmsg" + (isMe ? " me" : "");
  div.innerHTML = `<b>${escHtml(who)}：</b>${escHtml(text)}`;
  const log = document.getElementById("discuss-log");
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function sendDiscuss() {
  const inp = document.getElementById("discuss-in");
  const q = inp.value.trim();
  if (!q || !liveDiscuss) return;
  addDiscuss("你", q, true);
  ws.send(JSON.stringify({t: "discuss", text: q}));
  inp.value = "";
}
document.getElementById("discuss-send").onclick = sendDiscuss;
document.getElementById("discuss-in").addEventListener("keydown", e => { if (e.key === "Enter") sendDiscuss(); });

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("btn-back").onclick = () => {
  document.getElementById("endpanel").style.display = "none";  // 收起面板，对话记录仍在 feed 里可自由回看
};
document.getElementById("btn-end").onclick = () => {
  if (gameEnded) document.getElementById("endpanel").style.display = "flex";
};
document.getElementById("btn-again").onclick = () => {
  document.getElementById("endpanel").style.display = "none";
  lobby.style.display = "flex";
  refreshHistory();  // 回大厅时刷新历史列表
};
</script>
</body>
</html>
