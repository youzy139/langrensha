<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐺 多Agent狼人杀 · 人机对局</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #14151f; color: #e6e6e6; height: 100vh;
         display: flex; flex-direction: column; }
  header { padding: 10px 18px; background: #1d1f2e; display: flex;
           align-items: center; gap: 12px; border-bottom: 1px solid #333; }
  header h1 { font-size: 17px; color: #bb9af7; }
  #status { font-size: 13px; color: #888; }
  main { flex: 1; display: flex; min-height: 0; }
  #feed { flex: 1; overflow-y: auto; padding: 14px 18px; }
  #sidebar { width: 210px; background: #1d1f2e; border-left: 1px solid #333;
             padding: 14px; }
  .msg { margin: 5px 0; padding: 7px 11px; border-radius: 6px;
         background: #24283b; font-size: 14px; line-height: 1.55;
         white-space: pre-wrap; word-break: break-all; }
  .msg.private { background: #3d2f16; border-left: 3px solid #e0af68; }
  .msg.private::before { content: "🔒 "; }
  .msg.wolf { background: #3b1f2a; border-left: 3px solid #f7768e; }
  .msg.system { background: transparent; color: #7aa2f7; font-weight: bold;
                text-align: center; padding: 10px 0 2px; }
  #role-card { background: #2d2640; border: 1px solid #bb9af7;
               border-radius: 8px; padding: 12px; margin-bottom: 12px;
               font-size: 14px; line-height: 1.7; display: none; }
  #roster div { font-size: 13px; padding: 3px 0; color: #aaa; }
  #inputbar { padding: 10px 14px; background: #1d1f2e;
              border-top: 1px solid #333; }
  #ask-prompt { font-size: 14px; color: #e0af68; margin-bottom: 8px;
                display: none; }
  #choices { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #choices button { background: #364a82; color: #fff; border: none;
                    padding: 7px 16px; border-radius: 6px; cursor: pointer;
                    font-size: 14px; }
  #choices button:hover { background: #4a63a8; }
  #choices button.abstain { background: #555; }
  #textrow { display: flex; gap: 8px; }
  #textin { flex: 1; background: #24283b; border: 1px solid #444; color: #eee;
            padding: 9px 12px; border-radius: 6px; font-size: 14px; outline: none; }
  #textin:disabled { opacity: 0.4; }
  #sendbtn { background: #9ece6a; color: #14151f; border: none; padding: 0 20px;
             border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
  #sendbtn:disabled { opacity: 0.4; cursor: default; }
  #lobby { position: fixed; inset: 0; background: rgba(10,10,18,0.92);
           display: flex; align-items: center; justify-content: center; z-index: 10; }
  #lobby .panel { background: #1d1f2e; border: 1px solid #444;
                  border-radius: 12px; padding: 32px 40px; width: 380px; }
  #lobby h2 { color: #bb9af7; margin-bottom: 18px; text-align: center; }
  #lobby .group { margin-bottom: 16px; }
  #lobby .label { font-size: 13px; color: #999; margin-bottom: 6px; }
  #lobby .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  #lobby .opt { background: #24283b; border: 1px solid #444; color: #ddd;
                padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #lobby .opt.sel { background: #364a82; border-color: #7aa2f7; color: #fff; }
  #startbtn { width: 100%; background: #9ece6a; color: #14151f; border: none;
              padding: 11px; border-radius: 8px; font-size: 16px;
              font-weight: bold; cursor: pointer; margin-top: 6px; }
  .gameover { background: #2d2640 !important; border: 1px solid #bb9af7;
              font-size: 15px !important; }
</style>
</head>
<body>
<header>
  <h1>🐺 多Agent狼人杀 · 人机对局</h1>
  <span id="status">等待开局</span>
</header>
<main>
  <div id="feed"></div>
  <div id="sidebar">
    <div id="role-card"></div>
    <div id="roster"></div>
  </div>
</main>
<div id="inputbar">
  <div id="ask-prompt"></div>
  <div id="choices"></div>
  <div id="textrow">
    <input id="textin" placeholder="等待提问…" disabled>
    <button id="sendbtn" disabled>发送</button>
  </div>
</div>

<div id="lobby">
  <div class="panel">
    <h2>🐺 狼人杀 · 开局</h2>
    <div class="group">
      <div class="label">局型</div>
      <div class="opts" id="cfg-opts">
        <button class="opt sel" data-v="6p">6 人局</button>
        <button class="opt" data-v="8p">8 人局（含猎人）</button>
      </div>
    </div>
    <div class="group">
      <div class="label">你想扮演</div>
      <div class="opts" id="role-opts">
        <button class="opt sel" data-v="random">🎲 随机</button>
        <button class="opt" data-v="werewolf">🐺 狼人</button>
        <button class="opt" data-v="seer">🔮 预言家</button>
        <button class="opt" data-v="witch">🧪 女巫</button>
        <button class="opt" data-v="villager">👨‍🌾 平民</button>
      </div>
    </div>
    <button id="startbtn">开始对局</button>
  </div>
</div>

<script>
const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
const askPrompt = document.getElementById("ask-prompt");
const choicesEl = document.getElementById("choices");
const textin = document.getElementById("textin");
const sendbtn = document.getElementById("sendbtn");
const roleCard = document.getElementById("role-card");
const roster = document.getElementById("roster");
const lobby = document.getElementById("lobby");

let ws, selCfg = "6p", selRole = "random";

function bindOpts(id, cb) {
  document.getElementById(id).addEventListener("click", e => {
    if (!e.target.classList.contains("opt")) return;
    document.querySelectorAll("#" + id + " .opt").forEach(b => b.classList.remove("sel"));
    e.target.classList.add("sel");
    cb(e.target.dataset.v);
  });
}
bindOpts("cfg-opts", v => selCfg = v);
bindOpts("role-opts", v => selRole = v);

function addMsg(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + (kind || "public");
  if (text.startsWith("-----") || text.startsWith("=====")) div.className = "msg system";
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function setWaiting(on) {
  textin.disabled = on;
  sendbtn.disabled = on;
  if (!on) { askPrompt.style.display = "none"; choicesEl.style.display = "none";
             textin.placeholder = "等待提问…"; }
}

function showAsk(m) {
  askPrompt.textContent = "❓ " + m.prompt;
  askPrompt.style.display = "block";
  if (m.kind === "choice") {
    choicesEl.innerHTML = "";
    m.candidates.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c;
      b.onclick = () => { answer(c); };
      choicesEl.appendChild(b);
    });
    if (m.allow_abstain) {
      const b = document.createElement("button");
      b.textContent = "弃权/不用";
      b.className = "abstain";
      b.onclick = () => { answer(""); };
      choicesEl.appendChild(b);
    }
    choicesEl.style.display = "flex";
  } else {
    textin.disabled = false;
    textin.placeholder = "输入你的发言…";
    sendbtn.disabled = false;
    textin.focus();
  }
}

function answer(text) {
  ws.send(JSON.stringify({t: "answer", text}));
  setWaiting(true);
}

sendbtn.onclick = () => { if (textin.value.trim()) { answer(textin.value.trim()); textin.value = ""; } };
textin.addEventListener("keydown", e => { if (e.key === "Enter") sendbtn.onclick(); });

document.getElementById("startbtn").onclick = () => {
  lobby.style.display = "none";
  feed.innerHTML = "";
  roleCard.style.display = "none";
  statusEl.textContent = "连接中…";
  const proto = location.protocol === "https:" ? "wss" : "ws";
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onmessage = ev => handle(JSON.parse(ev.data));
    ws.onopen = () => ws.send(JSON.stringify({t: "start", config: selCfg, role: selRole}));
    ws.onclose = () => { statusEl.textContent = "连接已断开（刷新页面重开）"; };
  } else {
    ws.send(JSON.stringify({t: "start", config: selCfg, role: selRole}));
  }
};

function handle(m) {
  if (m.t === "feed") addMsg(m.text, m.kind);
  else if (m.t === "ask") { statusEl.textContent = "等待你的决策…"; showAsk(m); }
  else if (m.t === "role") {
    roleCard.innerHTML = `🎭 你的身份：<b>${m.role_name}</b>` +
      (m.mates ? `<br>🐺 狼队友：${m.mates}` : "");
    roleCard.style.display = "block";
  }
  else if (m.t === "started") {
    statusEl.textContent = `对局进行中 · 你是 ${m.name}`;
    roster.innerHTML = "<b style='font-size:13px'>玩家</b>" +
      m.players.map(p => `<div>${p === m.name ? "🧑 " + p + "（你）" : "🤖 " + p}</div>`).join("");
  }
  else if (m.t === "game_over") {
    statusEl.textContent = "对局结束";
    const who = m.winner === "village" ? "🎉 好人阵营获胜" : "🐺 狼人阵营获胜";
    addMsg(`${who}\n身份揭晓：${m.reveal}`, "public");
    feed.lastChild.classList.add("gameover");
    lobby.style.display = "flex";
    document.getElementById("startbtn").textContent = "再来一局";
  }
}
</script>
</body>
</html>
